name: Tests

on: [push, pull_request]

jobs:
  build:
    
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: chmod
      working-directory: .github/workflows
      run: |
        ls -la
        chmod +x ./sendgrid.js
        chmod +x deploy.sh
        chmod +x filter.sh
        chmod +x filter_errors.sh
          
    - name: ROOT Dependencies
      run: |
        sudo apt update ; 
        sudo apt install -y build-essential;
        
        sudo apt-get install dpkg-dev libc6 cmake g++ gcc binutils libx11-dev libxpm-dev \
        libxft-dev libxext-dev python3 libssl-dev ;

        #libglew1.5-dev
        sudo apt-get install -y gfortran libpcre3-dev \
        xlibmesa-glu-dev libftgl-dev \
        libmysqlclient-dev libfftw3-dev libcfitsio-dev \
        graphviz-dev libavahi-compat-libdnssd-dev \
        libldap2-dev python3-dev libxml2-dev libkrb5-dev \
        libgsl0-dev qtwebengine5-dev libvdt-dev \
        libtbb12 libtbb-dev;
                   
    - name: Build ROOT
      working-directory: .
      run: |
        # GitHub release instead of root.cern/download, which can be put behind CERN SSO
        ROOT_TGZ=root_v6.32.24.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz
        wget https://github.com/root-project/root/releases/download/v6-32-24/$ROOT_TGZ
        tar -xzvf $ROOT_TGZ
        rm -rf $ROOT_TGZ
    
      
    - name: CutLang Dependencies
      run: |
        sudo apt update
        sudo apt install -y flex bison wget
                   
    - name: Build CutLang
      working-directory: CLA
      run: |
        # from a clean state and in parallel, so missing dependencies between targets show up here
        source ../root/bin/thisroot.sh; root --version; make clean && make -j$(nproc)

    - name: Parser Tests
      working-directory: .
      run: |
        # grammar conflict counts, accepted and malformed ADL, error messages and exit codes (tests/parser/README.md)
        source root/bin/thisroot.sh; tests/parser/run_parser_tests.sh tests/parser/out_ci
    
    - name: Run Tests
      working-directory: .github/workflows
      run: |
        source ../../root/bin/thisroot.sh; ./deploy.sh 2>&1 | tee ./raw_output.txt
      
    - name: Filter Output
      working-directory: .github/workflows
      run: |
        ./filter.sh
        ./filter_errors.sh
        cd ../previous;
        diff raw_output.txt ../workflows/raw_output.txt | tee ../workflows/differences.txt;
        echo ended tee
        rm raw_output.txt errors.txt efficacy_charts.txt differences.txt;
        echo ended rm
        cd ../workflows;
        cp raw_output.txt errors.txt efficacy_charts.txt differences.txt ../previous/;
        echo ended cp raw_output
        mkdir artifacts; mv raw_output.txt errors.txt efficacy_charts.txt differences.txt ./artifacts
        if [ "`cat ./artifacts/errors.txt`" != "Errors: " ]; then
          touch flag
        fi

    - name: Update Artifacts
      if: ${{ github.event_name == 'push' }}
      working-directory: .github/workflows
      run: |
        git --version
        git status

        target_date=`date "+%Y-%m-%d" -d "6 day ago"`
        cur_date=`git log -1 --pretty="format:%cs" ../previous/raw_output.txt | tail -1`

        echo target_date: $target_date
        echo cur_date: $cur_date
        
        tar_date_int=$(date -d $target_date +%s)
        cur_date_int=$(date -d $cur_date +%s)

        if [ $tar_date_int -le $cur_date_int ]; then
          exit 0
        fi

        git config user.email "jinens8@gmail.com"
        git config user.name "bot"

        git --version
        git add ../previous
        git --version
        git status
        git commit -m "automated update" 
        git --version
        git status
        # git push origin ${GITHUB_REF##*/}
        # git --version
        # other workflows push to the same branch on the same push (VERSION bump), so rebase on them first
        branch=${GITHUB_REF##*/}
        for i in 1 2 3; do
          git pull --rebase --autostash origin $branch && git push origin HEAD:$branch && exit 0
          echo "push attempt $i rejected, retrying"; sleep 15
        done
        echo "could not push the updated baseline"; exit 1

    - name: Check for Bad Run Flag
      id: check_files
      uses: andstor/file-existence-action@v1
      with:
        files: "./.github/workflows/flag"

    - name: SMTP
      uses: peter-evans/sendgrid-action@v1
      if: steps.check_files.outputs.files_exists == 'true'
      env:
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        SCRIPT_FILEPATH: ./.github/workflows/sendgrid.js     
      
    - name: Upload Output File
      uses: actions/upload-artifact@v6
      with:
        name: tests (ubuntu-latest)
        path: ./.github/workflows/artifacts

    - name: Upload Parser Test Output
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: parser tests (ubuntu-latest)
        path: ./tests/parser/out_ci
        if-no-files-found: ignore
